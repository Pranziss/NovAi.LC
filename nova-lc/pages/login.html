<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght;500;600;700;800&family=Inter:wght;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
        }
      }
    }
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova LC — Sign In</title>
  
  <script>
    // Apply saved theme immediately to avoid flash
    const _t = localStorage.getItem('nlc-theme');
    if (_t === 'dark' || (!_t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center px-4 transition-colors duration-300">

  <!-- Back to home -->
  <a href="../index.html" class="fixed top-5 left-6 flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-brand-600 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Back
  </a>

  <!-- Theme toggle -->
  <button onclick="toggleTheme()" class="fixed top-5 right-6 w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
    <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
    <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
  </button>

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-2 mb-6">
        <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <span class="font-bold text-xl font-jakarta">Nova<span class="text-brand-600">LC</span></span>
      </a>
    </div>

    <!-- Card -->
    <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 shadow-xl shadow-gray-100/50 dark:shadow-none p-8">

      <!-- Tabs -->
      <div class="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1 mb-7">
        <button id="tab-login" onclick="switchTab('login')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm">
          Log In
        </button>
        <button id="tab-register" onclick="switchTab('register')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all text-gray-500 dark:text-gray-400">
          Register
        </button>
      </div>

      <!-- Error / Success banners -->
      <div id="auth-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-xl px-4 py-2.5"></div>
      <div id="auth-success" class="hidden mb-4 text-sm text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-xl px-4 py-2.5"></div>

      <!-- LOGIN FORM -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" required autocomplete="email"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all placeholder-gray-400"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
          <div class="relative">
            <input id="login-password" type="password" placeholder="••••••••" required autocomplete="current-password"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all placeholder-gray-400 pr-11"/>
            <button type="button" onclick="togglePw('login-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" id="login-btn" class="btn-primary w-full text-white font-semibold py-2.5 rounded-xl text-sm mt-2">
          Log In
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Username</label>
          <input id="reg-username" type="text" placeholder="e.g. johndoe" required minlength="3" maxlength="50" autocomplete="username"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all placeholder-gray-400"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
          <input id="reg-email" type="email" placeholder="you@example.com" required autocomplete="email"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all placeholder-gray-400"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
          <div class="relative">
            <input id="reg-password" type="password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all placeholder-gray-400 pr-11"/>
            <button type="button" onclick="togglePw('reg-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" id="reg-btn" class="btn-primary w-full text-white font-semibold py-2.5 rounded-xl text-sm mt-2">
          Create Account
        </button>
      </form>

      <!-- Demo button -->
      <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800">
        <button onclick="handleDemo()"
          class="w-full py-2.5 rounded-xl border-2 border-dashed border-gray-200 dark:border-gray-700 text-sm font-medium text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">
          🎯 Try Demo Account
        </button>
        <p class="text-center text-xs text-gray-400 mt-2">Explore the app without signing up</p>
      </div>
    </div>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    // Check if already logged in → go to dashboard
    if (nlcGetUser()) window.location.href = 'dashboard.html';

    // Switch tab based on URL param
    const urlTab = new URLSearchParams(window.location.search).get('tab');
    if (urlTab === 'register') switchTab('register');

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-register').classList.toggle('hidden', isLogin);
      document.getElementById('tab-login').className = `flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${isLogin ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`;
      document.getElementById('tab-register').className = `flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${!isLogin ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`;
      clearMessages();
    }

    function clearMessages() {
      document.getElementById('auth-error').classList.add('hidden');
      document.getElementById('auth-success').classList.add('hidden');
    }
    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function showSuccess(msg) {
      const el = document.getElementById('auth-success');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function togglePw(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearMessages();
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res  = await fetch('../api/auth/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Login failed'); return; }
        nlcSaveUser(data.user);
        showSuccess('Welcome back, ' + data.user.username + '! Redirecting...');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch {
        showError('Could not connect. Make sure XAMPP is running.');
      } finally {
        btn.textContent = 'Log In';
        btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearMessages();
      const btn = document.getElementById('reg-btn');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      const username = document.getElementById('reg-username').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        const res  = await fetch('../api/auth/register.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Registration failed'); return; }
        nlcSaveUser(data.user);
        showSuccess('Account created! Redirecting...');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch {
        showError('Could not connect. Make sure XAMPP is running.');
      } finally {
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }

    async function handleDemo() {
      clearMessages();
      try {
        const res  = await fetch('../api/auth/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'demo@novalc.local', password: 'demo123' })
        });
        const data = await res.json();
        if (!res.ok) {
          showError('Demo account not set up yet. Ask your admin to create demo@novalc.local / demo123.');
          return;
        }
        nlcSaveUser(data.user);
        window.location.href = 'dashboard.html';
      } catch {
        showError('Could not connect. Make sure XAMPP is running.');
      }
    }
  </script>
  <script src="../assets/js/chatbot.js"></script>
</body>
</html>
