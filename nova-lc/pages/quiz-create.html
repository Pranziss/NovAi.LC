<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova LC — Create Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans','sans-serif'], inter: ['Inter','sans-serif'] },
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen">

  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-white/80 dark:bg-gray-950/80 border-b border-gray-100 dark:border-gray-800">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <span class="font-bold text-lg font-jakarta">Nova<span class="text-brand-600">LC</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="text-sm text-gray-500 dark:text-gray-400 hover:text-brand-600 transition-colors">← Dashboard</a>
        <button onclick="toggleTheme()" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
          <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
          <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 pt-28 pb-16">
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold font-jakarta mb-1">Create Quiz Set</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Fill in the details and add your questions below.</p>
    </div>

    <div id="global-error" class="hidden mb-6 text-sm text-red-500 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-xl px-4 py-3"></div>
    <div id="global-success" class="hidden mb-6 text-sm text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-xl px-4 py-3"></div>

    <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-6 mb-6">
      <h2 class="font-bold font-jakarta text-lg mb-5">Quiz Info</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Title <span class="text-red-400">*</span></label>
          <input id="quiz-title" type="text" placeholder="e.g. Biology Chapter 3 Review" maxlength="100"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all placeholder-gray-400"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Description</label>
          <textarea id="quiz-desc" placeholder="What is this quiz about? (optional)" maxlength="300" rows="2"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all placeholder-gray-400 resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Subject</label>
            <select id="quiz-subject-select" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 transition-all">
              <option value="">— Select subject —</option>
              <option value="Math">Math</option>
              <option value="Science">Science</option>
              <option value="English">English</option>
              <option value="History">History</option>
              <option value="Filipino">Filipino</option>
              <option value="Technology">Technology</option>
              <option value="Programming">Programming</option>
              <option value="General Knowledge">General Knowledge</option>
              <option value="other">Other (type below)</option>
            </select>
          </div>
          <div id="other-subject-wrap" class="hidden">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Custom Subject</label>
            <input id="quiz-subject-other" type="text" placeholder="Type subject..." maxlength="50"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 transition-all placeholder-gray-400"/>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="quiz-public" checked class="sr-only peer"/>
            <div class="w-10 h-6 bg-gray-200 dark:bg-gray-700 peer-checked:bg-brand-600 rounded-full transition-colors"></div>
            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4 shadow"></div>
          </label>
          <span class="text-sm text-gray-600 dark:text-gray-400">Make this quiz public (visible on Discover)</span>
        </div>
      </div>
    </div>

    <div class="mb-4 flex items-center justify-between">
      <h2 class="font-bold font-jakarta text-lg">Questions <span id="question-count" class="text-brand-600">(0)</span></h2>
      <button id="add-question-btn" class="flex items-center gap-2 btn-primary text-white text-sm font-semibold px-4 py-2 rounded-xl">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add Question
      </button>
    </div>

    <div id="questions-container" class="space-y-4 mb-8">
      <div id="empty-state" class="text-center py-12 bg-white dark:bg-gray-900 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">
        <svg class="w-10 h-10 text-gray-300 dark:text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="text-sm text-gray-400">No questions yet. Click <strong>Add Question</strong> to start.</p>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3">
      <a href="dashboard.html" class="text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 font-medium transition-colors">Cancel</a>
      <button id="save-btn" class="btn-primary text-white font-semibold px-8 py-3 rounded-xl text-sm">Save Quiz Set</button>
    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script>
    // --- AUTH GUARD ---
    async function checkSession() {
      const res = await fetch('../api/auth/session.php')
      if (!res.ok) window.location.href = 'login.html'
    }
    checkSession()

    let questionCount = 0

    // --- SUBJECT TOGGLE ---
    document.getElementById('quiz-subject-select').addEventListener('change', function() {
      document.getElementById('other-subject-wrap').classList.toggle('hidden', this.value !== 'other')
    })

    // --- ADD QUESTION ---
    document.getElementById('add-question-btn').addEventListener('click', function() {
      questionCount++
      document.getElementById('empty-state')?.remove()
      document.getElementById('question-count').textContent = `(${questionCount})`

      const qIndex = questionCount
      const card = document.createElement('div')
      card.id = `question-${qIndex}`
      card.dataset.index = qIndex
      card.className = 'question-card bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-6'
      card.innerHTML = `
        <div class="flex items-start justify-between mb-4">
          <span class="text-xs font-bold text-brand-600 bg-brand-50 dark:bg-brand-900/30 px-2.5 py-1 rounded-lg">Question ${qIndex}</span>
          <button onclick="removeQuestion(${qIndex})" class="text-gray-300 hover:text-red-400 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Question Text <span class="text-red-400">*</span></label>
          <input type="text" id="q-text-${qIndex}" placeholder="Type your question here..." maxlength="300"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 transition-all placeholder-gray-400"/>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          ${[0,1,2,3].map(i => `
            <div class="relative">
              <input type="text" id="q-choice-${qIndex}-${i}" placeholder="Choice ${String.fromCharCode(65+i)}" maxlength="150"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:border-brand-400 transition-all placeholder-gray-400"/>
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-gray-400">${String.fromCharCode(65+i)}</span>
            </div>
          `).join('')}
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Correct Answer <span class="text-red-400">*</span></label>
          <div class="flex gap-2">
            ${[0,1,2,3].map(i => `
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="correct-${qIndex}" value="${i}" class="sr-only peer" ${i===0?'checked':''}/>
                <div class="text-center py-2 rounded-xl border-2 border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-400 peer-checked:border-brand-500 peer-checked:bg-brand-50 dark:peer-checked:bg-brand-900/30 peer-checked:text-brand-600 transition-all cursor-pointer">
                  ${String.fromCharCode(65+i)}
                </div>
              </label>
            `).join('')}
          </div>
        </div>
      `
      document.getElementById('questions-container').appendChild(card)
    })

    // --- REMOVE QUESTION ---
    function removeQuestion(index) {
      document.getElementById(`question-${index}`)?.remove()
      const remaining = document.querySelectorAll('.question-card').length
      document.getElementById('question-count').textContent = `(${remaining})`
      if (remaining === 0) {
        questionCount = 0
        document.getElementById('questions-container').innerHTML = `
          <div id="empty-state" class="text-center py-12 bg-white dark:bg-gray-900 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">
            <svg class="w-10 h-10 text-gray-300 dark:text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p class="text-sm text-gray-400">No questions yet. Click <strong>Add Question</strong> to start.</p>
          </div>`
      }
    }

    // --- SAVE QUIZ ---
    document.getElementById('save-btn').addEventListener('click', async function() {
      const errEl = document.getElementById('global-error')
      const sucEl = document.getElementById('global-success')
      const btn   = this

      errEl.classList.add('hidden')
      sucEl.classList.add('hidden')

      const title = document.getElementById('quiz-title').value.trim()
      const desc  = document.getElementById('quiz-desc').value.trim()
      const subjectSelect = document.getElementById('quiz-subject-select').value
      const subject = subjectSelect === 'other'
        ? document.getElementById('quiz-subject-other').value.trim()
        : subjectSelect
      const isPublic = document.getElementById('quiz-public').checked ? 1 : 0

      if (!title) {
        errEl.textContent = 'Please enter a quiz title.'
        errEl.classList.remove('hidden')
        return
      }

      const questionCards = document.querySelectorAll('.question-card')
      if (questionCards.length === 0) {
        errEl.textContent = 'Please add at least one question.'
        errEl.classList.remove('hidden')
        return
      }

      const questions = []
      for (const card of questionCards) {
        const idx = card.dataset.index
        const text = document.getElementById(`q-text-${idx}`)?.value.trim()
        const choices = [0,1,2,3].map(i => document.getElementById(`q-choice-${idx}-${i}`)?.value.trim())
        const correctRadio = document.querySelector(`input[name="correct-${idx}"]:checked`)
        const correctIndex = correctRadio ? parseInt(correctRadio.value) : 0

        if (!text) {
          errEl.textContent = `Question ${idx} is missing its question text.`
          errEl.classList.remove('hidden')
          return
        }
        if (choices.some(c => !c)) {
          errEl.textContent = `Question ${idx} — fill in all 4 choices.`
          errEl.classList.remove('hidden')
          return
        }
        questions.push({ question_text: text, choices, correct_index: correctIndex })
      }

      btn.textContent = 'Saving...'
      btn.disabled = true

      try {
        const res  = await fetch('../api/quiz/create.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description: desc, subject, is_public: isPublic, questions })
        })
        const data = await res.json()

        if (data.error) {
          errEl.textContent = data.error
          errEl.classList.remove('hidden')
          btn.textContent = 'Save Quiz Set'
          btn.disabled = false
        } else {
          sucEl.textContent = '✓ Quiz set saved! Redirecting...'
          sucEl.classList.remove('hidden')
          setTimeout(() => window.location.href = `quiz-detail.html?id=${data.quiz_id}`, 1500)
        }
      } catch {
        errEl.textContent = 'Something went wrong. Is XAMPP running?'
        errEl.classList.remove('hidden')
        btn.textContent = 'Save Quiz Set'
        btn.disabled = false
      }
    })
  </script>
</body>
</html>
