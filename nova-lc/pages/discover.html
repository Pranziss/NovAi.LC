<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght;500;600;700;800&family=Inter:wght;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
        }
      }
    }
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova LC — Discover</title>
  <script>
    const _t = localStorage.getItem('nlc-theme');
    if (_t === 'dark' || (!_t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-white/80 dark:bg-gray-950/80 border-b border-gray-100 dark:border-gray-800">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-brand-600 transition-colors font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Dashboard
      </a>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <span class="font-bold text-lg font-jakarta">Nova<span class="text-brand-600">LC</span></span>
      </div>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 pt-24 pb-16">

    <!-- Header -->
    <div class="mb-8 fade-up">
      <h1 class="text-3xl font-extrabold font-jakarta mb-1">Discover Quizzes</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Browse and take public quiz sets from other learners.</p>
    </div>

    <!-- Search + Filter -->
    <div class="flex flex-col sm:flex-row gap-3 mb-8 fade-up">
      <div class="relative flex-1">
        <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="search-input" type="text" placeholder="Search quizzes..."
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900/30 transition-all"/>
      </div>
      <select id="subject-filter"
        class="px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm outline-none focus:border-brand-400 transition-all text-gray-600 dark:text-gray-300">
        <option value="">All Subjects</option>
        <option>Math</option>
        <option>Science</option>
        <option>English</option>
        <option>History</option>
        <option>Filipino</option>
        <option>Technology</option>
        <option>Programming</option>
        <option>General Knowledge</option>
      </select>
    </div>

    <!-- Subject chips -->
    <div class="flex flex-wrap gap-2 mb-8 fade-up" id="subject-chips">
      <button onclick="filterSubject('')"     class="chip active px-3 py-1.5 rounded-full text-xs font-semibold border-2 border-brand-500 bg-brand-50 dark:bg-brand-900/30 text-brand-600">All</button>
      <button onclick="filterSubject('Math')" class="chip px-3 py-1.5 rounded-full text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">Math</button>
      <button onclick="filterSubject('Science')" class="chip px-3 py-1.5 rounded-full text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">Science</button>
      <button onclick="filterSubject('English')" class="chip px-3 py-1.5 rounded-full text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">English</button>
      <button onclick="filterSubject('History')" class="chip px-3 py-1.5 rounded-full text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">History</button>
      <button onclick="filterSubject('Filipino')" class="chip px-3 py-1.5 rounded-full text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">Filipino</button>
      <button onclick="filterSubject('Technology')" class="chip px-3 py-1.5 rounded-full text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">Technology</button>
      <button onclick="filterSubject('Programming')" class="chip px-3 py-1.5 rounded-full text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">Programming</button>
    </div>

    <!-- Loading -->
    <div id="discover-loading" class="text-center py-16 text-gray-400 text-sm">
      <svg class="w-6 h-6 animate-spin mx-auto mb-3 text-brand-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
      Loading quizzes...
    </div>

    <!-- Empty -->
    <div id="discover-empty" class="hidden text-center py-16">
      <svg class="w-12 h-12 text-gray-200 dark:text-gray-700 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <p class="text-gray-400 text-sm">No quizzes found. Try a different search.</p>
    </div>

    <!-- Grid -->
    <div id="discover-grid" class="hidden grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    nlcRequireAuth('login.html');

    document.querySelectorAll('.fade-up').forEach(el => setTimeout(() => el.classList.add('visible'), 50));

    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadQuizzes, 350);
    });
    document.getElementById('subject-filter').addEventListener('change', loadQuizzes);

    const SUBJECT_COLORS = {
      'Math':'bg-blue-100 dark:bg-blue-900/30 text-blue-600','Science':'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600',
      'English':'bg-violet-100 dark:bg-violet-900/30 text-violet-600','History':'bg-amber-100 dark:bg-amber-900/30 text-amber-600',
      'Filipino':'bg-rose-100 dark:bg-rose-900/30 text-rose-600','Technology':'bg-sky-100 dark:bg-sky-900/30 text-sky-600',
      'Programming':'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600',
    };

    function filterSubject(subject) {
      document.getElementById('subject-filter').value = subject;
      document.querySelectorAll('.chip').forEach(c => {
        const isActive = c.textContent.trim() === (subject || 'All');
        c.className = `chip px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${isActive
          ? 'border-2 border-brand-500 bg-brand-50 dark:bg-brand-900/30 text-brand-600'
          : 'border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600'}`;
      });
      loadQuizzes();
    }

    async function loadQuizzes() {
      const search  = document.getElementById('search-input').value.trim();
      const subject = document.getElementById('subject-filter').value;

      document.getElementById('discover-loading').classList.remove('hidden');
      document.getElementById('discover-empty').classList.add('hidden');
      document.getElementById('discover-grid').classList.add('hidden');

      const qs = new URLSearchParams();
      if (search)  qs.set('search', search);
      if (subject) qs.set('subject', subject);

      try {
        const res     = await fetch(`../api/quiz/get_public.php?${qs}`);
        const quizzes = await res.json();

        document.getElementById('discover-loading').classList.add('hidden');

        if (!Array.isArray(quizzes) || quizzes.length === 0) {
          document.getElementById('discover-empty').classList.remove('hidden');
          return;
        }

        const grid = document.getElementById('discover-grid');
        grid.classList.remove('hidden');
        grid.innerHTML = quizzes.map(q => {
          const date = new Date(q.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const badgeCls = SUBJECT_COLORS[q.subject] || 'bg-gray-100 dark:bg-gray-800 text-gray-500';
          return `
            <div onclick="window.location.href='quiz-detail.html?id=${q.id}'"
              class="card-hover bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 cursor-pointer">
              <div class="flex items-start justify-between mb-3">
                ${q.subject ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${badgeCls}">${q.subject}</span>` : '<span></span>'}
                <span class="text-xs text-gray-400">${q.question_count} Qs</span>
              </div>
              <h3 class="font-bold font-jakarta text-base mb-1 leading-snug text-gray-900 dark:text-white line-clamp-2">${q.title}</h3>
              ${q.description ? `<p class="text-xs text-gray-400 mb-3 line-clamp-2">${q.description}</p>` : '<div class="mb-3"></div>'}
              <div class="flex items-center justify-between text-xs text-gray-400">
                <span>by <span class="font-medium text-gray-600 dark:text-gray-300">${q.creator}</span></span>
                <span>${date}</span>
              </div>
            </div>`;
        }).join('');
      } catch {
        document.getElementById('discover-loading').innerHTML = '<p class="text-red-400 text-sm text-center">Failed to load. Is XAMPP running?</p>';
      }
    }

    loadQuizzes();
  </script>
  <script src="../assets/js/chatbot.js"></script>
</body>
</html>
