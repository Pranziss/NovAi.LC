<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght;500;600;700;800&family=Inter:wght;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
        }
      }
    }
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova LC — Dashboard</title>
  <script>
    const _t = localStorage.getItem('nlc-theme');
    if (_t === 'dark' || (!_t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-white/80 dark:bg-gray-950/80 border-b border-gray-100 dark:border-gray-800">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <span class="font-bold text-lg font-jakarta">Nova<span class="text-brand-600">LC</span></span>
      </div>
      <div class="flex items-center gap-3">
        <a href="discover.html" class="hidden sm:flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400 hover:text-brand-600 transition-colors font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          Discover
        </a>
        <span id="admin-link-wrap" class="hidden">
          <a href="admin.html" class="hidden sm:flex items-center gap-1.5 text-sm text-amber-600 hover:text-amber-700 transition-colors font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Admin
          </a>
        </span>
        <button onclick="toggleTheme()" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
          <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
          <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-brand-100 dark:bg-brand-900/40 flex items-center justify-center text-brand-600 font-bold text-xs" id="nav-avatar">?</div>
          <span id="nav-username" class="hidden sm:block text-sm font-medium text-gray-700 dark:text-gray-300"></span>
        </div>
        <button data-logout class="text-sm text-gray-500 dark:text-gray-400 hover:text-red-500 transition-colors font-medium">
          Log out
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 pt-24 pb-16">

    <!-- Header -->
    <div class="mb-8 fade-up">
      <h1 class="text-3xl font-extrabold font-jakarta mb-1">Welcome back, <span id="greeting-name" class="text-brand-600">—</span> 👋</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Here's an overview of your learning activity.</p>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10 fade-up">
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5">
        <p class="text-xs text-gray-400 mb-1 font-medium uppercase tracking-wide">Quizzes Created</p>
        <p id="stat-created" class="text-3xl font-extrabold font-jakarta text-gray-900 dark:text-white">—</p>
      </div>
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5">
        <p class="text-xs text-gray-400 mb-1 font-medium uppercase tracking-wide">Quizzes Taken</p>
        <p id="stat-taken" class="text-3xl font-extrabold font-jakarta text-gray-900 dark:text-white">—</p>
      </div>
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5">
        <p class="text-xs text-gray-400 mb-1 font-medium uppercase tracking-wide">Avg Score</p>
        <p id="stat-avg" class="text-3xl font-extrabold font-jakarta text-brand-600">—</p>
      </div>
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5">
        <p class="text-xs text-gray-400 mb-1 font-medium uppercase tracking-wide">Best Score</p>
        <p id="stat-best" class="text-3xl font-extrabold font-jakarta text-emerald-500">—</p>
      </div>
    </div>

    <!-- My Quiz Sets -->
    <div class="fade-up">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold font-jakarta">My Quiz Sets</h2>
        <div class="flex items-center gap-3">
          <a href="quiz-create.html" class="btn-primary text-white text-sm font-semibold px-4 py-2 rounded-xl flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            New Quiz
          </a>
        </div>
      </div>

      <!-- Loading state -->
      <div id="quizzes-loading" class="text-center py-16 text-gray-400 text-sm">
        <svg class="w-6 h-6 animate-spin mx-auto mb-3 text-brand-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
        Loading your quizzes...
      </div>

      <!-- Empty state -->
      <div id="quizzes-empty" class="hidden text-center py-16 bg-white dark:bg-gray-900 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">
        <svg class="w-12 h-12 text-gray-200 dark:text-gray-700 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <p class="text-gray-400 text-sm mb-4">No quiz sets yet. Create your first one!</p>
        <a href="quiz-create.html" class="btn-primary text-white text-sm font-semibold px-5 py-2.5 rounded-xl inline-block">Create Quiz</a>
      </div>

      <!-- Quiz grid -->
      <div id="quizzes-grid" class="hidden grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const user = nlcRequireAuth('login.html');
    if (user) init();

    function init() {
      // Set nav
      document.getElementById('nav-username').textContent = user.username;
      document.getElementById('nav-avatar').textContent = user.username.charAt(0).toUpperCase();
      document.getElementById('greeting-name').textContent = user.username;
      if (user.is_admin) document.getElementById('admin-link-wrap').classList.remove('hidden');

      loadStats();
      loadQuizzes();

      // Fade animations
      document.querySelectorAll('.fade-up').forEach(el => {
        setTimeout(() => el.classList.add('visible'), 50);
      });
    }

    async function loadStats() {
      try {
        const res  = await fetch('../api/dashboard/stats.php');
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('stat-created').textContent = data.quiz_count;
        document.getElementById('stat-taken').textContent   = data.taken;
        document.getElementById('stat-avg').textContent     = data.avg_score + '%';
        document.getElementById('stat-best').textContent    = data.best_score + '%';
      } catch {}
    }

    async function loadQuizzes() {
      try {
        const res    = await fetch('../api/quiz/get_mine.php');
        const quizzes = await res.json();

        document.getElementById('quizzes-loading').classList.add('hidden');

        if (!Array.isArray(quizzes) || quizzes.length === 0) {
          document.getElementById('quizzes-empty').classList.remove('hidden');
          return;
        }

        const grid = document.getElementById('quizzes-grid');
        grid.classList.remove('hidden');
        grid.innerHTML = quizzes.map(q => quizCard(q)).join('');
      } catch {
        document.getElementById('quizzes-loading').innerHTML =
          '<p class="text-red-400 text-sm">Failed to load quizzes. Is XAMPP running?</p>';
      }
    }

    const SUBJECT_COLORS = {
      'Math': 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400',
      'Science': 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400',
      'English': 'bg-violet-100 dark:bg-violet-900/30 text-violet-600 dark:text-violet-400',
      'History': 'bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400',
      'Filipino': 'bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400',
      'Technology': 'bg-sky-100 dark:bg-sky-900/30 text-sky-600 dark:text-sky-400',
      'Programming': 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400',
    };

    function subjectBadge(subject) {
      const cls = SUBJECT_COLORS[subject] || 'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400';
      return subject ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${cls}">${subject}</span>` : '';
    }

    function quizCard(q) {
      const date = new Date(q.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      return `
        <div onclick="window.location.href='quiz-detail.html?id=${q.id}'"
          class="card-hover bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 cursor-pointer">
          <div class="flex items-start justify-between mb-3">
            ${subjectBadge(q.subject)}
            <span class="text-xs text-gray-400">${q.is_public ? '🌐 Public' : '🔒 Private'}</span>
          </div>
          <h3 class="font-bold font-jakarta text-base mb-1 leading-snug text-gray-900 dark:text-white line-clamp-2">${q.title}</h3>
          ${q.description ? `<p class="text-xs text-gray-400 mb-3 line-clamp-2">${q.description}</p>` : '<div class="mb-3"></div>'}
          <div class="flex items-center justify-between text-xs text-gray-400">
            <span>${q.question_count} question${q.question_count !== 1 ? 's' : ''}</span>
            <span>${date}</span>
          </div>
        </div>`;
    }
  </script>
  <script src="../assets/js/chatbot.js"></script>
</body>
</html>
