<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght;500;600;700;800&family=Inter:wght;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
        }
      }
    }
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova LC — Admin</title>
  <script>
    const _t = localStorage.getItem('nlc-theme');
    if (_t === 'dark' || (!_t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-white/80 dark:bg-gray-950/80 border-b border-gray-100 dark:border-gray-800">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-brand-600 transition-colors font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Dashboard
      </a>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </div>
        <span class="font-bold text-lg font-jakarta">Admin Panel</span>
      </div>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 pt-24 pb-16">

    <div class="mb-8 fade-up">
      <div class="inline-flex items-center gap-2 bg-amber-50 dark:bg-amber-900/20 text-amber-600 dark:text-amber-400 text-xs font-semibold px-3 py-1.5 rounded-full mb-3 border border-amber-100 dark:border-amber-800">
        <span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span>
        Admin Access Only
      </div>
      <h1 class="text-3xl font-extrabold font-jakarta mb-1">Admin Panel</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Manage all users and quizzes on the platform.</p>
    </div>

    <!-- Tabs -->
    <div class="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1 mb-8 w-fit fade-up">
      <button onclick="showTab('users')" id="tab-users"
        class="px-5 py-2 text-sm font-semibold rounded-lg transition-all bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm">
        👥 Users
      </button>
      <button onclick="showTab('quizzes')" id="tab-quizzes"
        class="px-5 py-2 text-sm font-semibold rounded-lg transition-all text-gray-500 dark:text-gray-400">
        📋 All Quizzes
      </button>
    </div>

    <!-- Toast -->
    <div id="admin-toast" class="hidden fixed bottom-6 right-6 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 text-sm font-medium px-4 py-3 rounded-xl shadow-xl z-50"></div>

    <!-- USERS TAB -->
    <div id="panel-users">
      <div id="users-loading" class="text-center py-16 text-gray-400 text-sm">
        <svg class="w-5 h-5 animate-spin mx-auto mb-2 text-brand-400" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        Loading users...
      </div>
      <div id="users-table-wrap" class="hidden bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-100 dark:border-gray-800 text-xs text-gray-400 uppercase tracking-wide">
              <th class="text-left px-5 py-3 font-semibold">User</th>
              <th class="text-left px-5 py-3 font-semibold hidden sm:table-cell">Email</th>
              <th class="text-center px-5 py-3 font-semibold">Quizzes</th>
              <th class="text-center px-5 py-3 font-semibold">Attempts</th>
              <th class="text-center px-5 py-3 font-semibold">Role</th>
              <th class="text-center px-5 py-3 font-semibold">Action</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- QUIZZES TAB -->
    <div id="panel-quizzes" class="hidden">
      <div id="quizzes-loading-admin" class="text-center py-16 text-gray-400 text-sm">
        <svg class="w-5 h-5 animate-spin mx-auto mb-2 text-brand-400" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        Loading quizzes...
      </div>
      <div id="quizzes-table-wrap" class="hidden bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-100 dark:border-gray-800 text-xs text-gray-400 uppercase tracking-wide">
              <th class="text-left px-5 py-3 font-semibold">Title</th>
              <th class="text-left px-5 py-3 font-semibold hidden sm:table-cell">Creator</th>
              <th class="text-left px-5 py-3 font-semibold hidden md:table-cell">Subject</th>
              <th class="text-center px-5 py-3 font-semibold">Qs</th>
              <th class="text-center px-5 py-3 font-semibold">Visibility</th>
              <th class="text-center px-5 py-3 font-semibold">Action</th>
            </tr>
          </thead>
          <tbody id="quizzes-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Confirm modal -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-6 max-w-sm w-full shadow-2xl">
      <h3 id="modal-title" class="font-bold font-jakarta text-lg mb-2"></h3>
      <p id="modal-desc" class="text-sm text-gray-500 dark:text-gray-400 mb-6"></p>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">Cancel</button>
        <button id="modal-confirm-btn" class="flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-semibold transition-colors">Delete</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    var user = nlcRequireAuth('login.html');
    if (user && !user.is_admin) window.location.href = 'dashboard.html';
    if (user) init();

    var pendingAction  = null;
    var quizzesLoaded  = false;

    function init() {
      loadUsers();
      document.querySelectorAll('.fade-up').forEach(function(el) {
        setTimeout(function() { el.classList.add('visible'); }, 50);
      });
    }

    function showTab(tab) {
      var isUsers       = tab === 'users';
      var activeClass   = 'px-5 py-2 text-sm font-semibold rounded-lg transition-all bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm';
      var inactiveClass = 'px-5 py-2 text-sm font-semibold rounded-lg transition-all text-gray-500 dark:text-gray-400';

      document.getElementById('panel-users').classList.toggle('hidden', !isUsers);
      document.getElementById('panel-quizzes').classList.toggle('hidden', isUsers);
      document.getElementById('tab-users').className   = isUsers  ? activeClass : inactiveClass;
      document.getElementById('tab-quizzes').className = !isUsers ? activeClass : inactiveClass;

      if (!isUsers && !quizzesLoaded) loadAllQuizzes();
    }

    async function loadUsers() {
      try {
        var res   = await fetch('../api/admin/get_users.php');
        var users = await res.json();

        document.getElementById('users-loading').classList.add('hidden');
        document.getElementById('users-table-wrap').classList.remove('hidden');

        var rows = '';
        for (var i = 0; i < users.length; i++) {
          var u       = users[i];
          var initial = u.username.charAt(0).toUpperCase();
          var isSelf  = (u.id === user.id);

          var roleBadge = u.is_admin
            ? '<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600">Admin</span>'
            : '<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-400">User</span>';

          var actionCell = isSelf
            ? '<span class="text-xs text-gray-300 dark:text-gray-600">You</span>'
            : '<button onclick="promptDeleteUser(' + u.id + ', \'' + u.username + '\')" class="text-xs text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 px-2.5 py-1 rounded-lg transition-all font-medium">Delete</button>';

          rows += '<tr class="border-b border-gray-50 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">'
            + '<td class="px-5 py-3"><div class="flex items-center gap-2.5">'
            + '<div class="w-7 h-7 rounded-full bg-brand-100 dark:bg-brand-900/40 flex items-center justify-center text-brand-600 font-bold text-xs">' + initial + '</div>'
            + '<span class="font-medium text-gray-800 dark:text-gray-200">' + u.username + '</span>'
            + '</div></td>'
            + '<td class="px-5 py-3 text-gray-500 dark:text-gray-400 hidden sm:table-cell">' + u.email + '</td>'
            + '<td class="px-5 py-3 text-center text-gray-600 dark:text-gray-400">' + u.quiz_count + '</td>'
            + '<td class="px-5 py-3 text-center text-gray-600 dark:text-gray-400">' + u.attempt_count + '</td>'
            + '<td class="px-5 py-3 text-center">' + roleBadge + '</td>'
            + '<td class="px-5 py-3 text-center">' + actionCell + '</td>'
            + '</tr>';
        }
        document.getElementById('users-tbody').innerHTML = rows;

      } catch (e) {
        document.getElementById('users-loading').innerHTML = '<p class="text-red-400 text-sm text-center">Failed to load users.</p>';
      }
    }

    async function loadAllQuizzes() {
      quizzesLoaded = true;
      try {
        var res     = await fetch('../api/admin/get_all_quizzes.php');
        var quizzes = await res.json();

        document.getElementById('quizzes-loading-admin').classList.add('hidden');
        document.getElementById('quizzes-table-wrap').classList.remove('hidden');

        var rows = '';
        for (var i = 0; i < quizzes.length; i++) {
          var q         = quizzes[i];
          var safeTitle = q.title.replace(/'/g, "\\'");
          var subject   = q.subject ? q.subject : '—';

          var visBadge = q.is_public
            ? '<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-50 dark:bg-brand-900/30 text-brand-600">Public</span>'
            : '<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-400">Private</span>';

          rows += '<tr class="border-b border-gray-50 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">'
            + '<td class="px-5 py-3"><a href="quiz-detail.html?id=' + q.id + '" class="font-medium text-gray-800 dark:text-gray-200 hover:text-brand-600 transition-colors">' + q.title + '</a></td>'
            + '<td class="px-5 py-3 text-gray-500 dark:text-gray-400 hidden sm:table-cell">' + q.creator + '</td>'
            + '<td class="px-5 py-3 text-gray-500 dark:text-gray-400 hidden md:table-cell">' + subject + '</td>'
            + '<td class="px-5 py-3 text-center text-gray-600 dark:text-gray-400">' + q.question_count + '</td>'
            + '<td class="px-5 py-3 text-center">' + visBadge + '</td>'
            + '<td class="px-5 py-3 text-center"><button onclick="promptDeleteQuiz(' + q.id + ', \'' + safeTitle + '\')" class="text-xs text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 px-2.5 py-1 rounded-lg transition-all font-medium">Delete</button></td>'
            + '</tr>';
        }
        document.getElementById('quizzes-tbody').innerHTML = rows;

      } catch (e) {
        document.getElementById('quizzes-loading-admin').innerHTML = '<p class="text-red-400 text-sm text-center">Failed to load quizzes.</p>';
      }
    }

    function promptDeleteUser(id, username) {
      document.getElementById('modal-title').textContent = 'Delete "' + username + '"?';
      document.getElementById('modal-desc').textContent  = 'This will permanently delete ' + username + ' and all their quizzes and activity. Cannot be undone.';
      pendingAction = async function() {
        var res = await fetch('../api/admin/delete_user.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: id })
        });
        if (res.ok) { showToast(username + ' deleted.'); loadUsers(); }
      };
      document.getElementById('confirm-modal').classList.replace('hidden', 'flex');
    }

    function promptDeleteQuiz(id, title) {
      document.getElementById('modal-title').textContent = 'Delete "' + title + '"?';
      document.getElementById('modal-desc').textContent  = 'This will permanently delete the quiz and all its questions. Cannot be undone.';
      pendingAction = async function() {
        var res = await fetch('../api/quiz/delete.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quiz_id: id })
        });
        if (res.ok) {
          showToast('Quiz deleted.');
          quizzesLoaded = false;
          loadAllQuizzes();
        }
      };
      document.getElementById('confirm-modal').classList.replace('hidden', 'flex');
    }

    document.getElementById('modal-confirm-btn').addEventListener('click', async function() {
      if (!pendingAction) return;
      var btn = document.getElementById('modal-confirm-btn');
      btn.textContent = 'Deleting...';
      btn.disabled    = true;
      try { await pendingAction(); } catch(e) {}
      btn.textContent = 'Delete';
      btn.disabled    = false;
      closeModal();
    });

    function closeModal() {
      document.getElementById('confirm-modal').classList.replace('flex', 'hidden');
      pendingAction = null;
    }

    function showToast(msg) {
      var el = document.getElementById('admin-toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(function() { el.classList.add('hidden'); }, 3000);
    }
  </script>
  <script src="../assets/js/chatbot.js"></script>
</body>
</html>
