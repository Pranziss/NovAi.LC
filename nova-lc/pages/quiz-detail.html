<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght;500;600;700;800&family=Inter:wght;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
        }
      }
    }
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova LC — Quiz Detail</title>
  <script>
    const _t = localStorage.getItem('nlc-theme');
    if (_t === 'dark' || (!_t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-white/80 dark:bg-gray-950/80 border-b border-gray-100 dark:border-gray-800">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-brand-600 transition-colors font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Dashboard
      </a>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <span class="font-bold text-lg font-jakarta">Nova<span class="text-brand-600">LC</span></span>
      </div>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 pt-24 pb-16">

    <div id="detail-loading" class="text-center py-24 text-gray-400 text-sm">
      <svg class="w-6 h-6 animate-spin mx-auto mb-3 text-brand-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
      Loading quiz...
    </div>

    <div id="detail-content" class="hidden">

      <!-- Quiz header card -->
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-8 mb-6 fade-up">
        <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
          <div>
            <div class="flex items-center gap-2 mb-3" id="detail-badges"></div>
            <h1 id="detail-title" class="text-2xl md:text-3xl font-extrabold font-jakarta leading-tight text-gray-900 dark:text-white"></h1>
          </div>
          <button id="delete-btn" class="hidden flex items-center gap-1.5 text-sm text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 px-3 py-2 rounded-xl transition-all font-medium border border-transparent hover:border-red-100 dark:hover:border-red-800">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Delete
          </button>
        </div>
        <p id="detail-desc" class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed mb-6"></p>

        <!-- Meta row -->
        <div class="flex flex-wrap items-center gap-5 text-sm text-gray-500 dark:text-gray-400 pb-6 mb-6 border-b border-gray-100 dark:border-gray-800">
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span id="detail-qcount"></span> questions
          </span>
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Created by <strong id="detail-creator" class="ml-1 text-gray-700 dark:text-gray-300"></strong>
          </span>
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span id="detail-date"></span>
          </span>
        </div>

        <!-- CTA -->
        <div class="flex flex-wrap items-center gap-3">
          <a id="start-btn" href="#" class="btn-primary text-white font-semibold px-8 py-3 rounded-xl text-sm flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Start Quiz
          </a>
        </div>
      </div>

      <!-- Questions preview -->
      <div class="fade-up">
        <h2 class="text-lg font-bold font-jakarta mb-4">Questions Preview</h2>
        <div id="questions-preview" class="space-y-3"></div>
      </div>
    </div>
  </main>

  <!-- Delete confirm modal -->
  <div id="delete-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-6 max-w-sm w-full shadow-2xl">
      <h3 class="font-bold font-jakarta text-lg mb-2">Delete Quiz?</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">This will permanently delete the quiz and all its questions. This cannot be undone.</p>
      <div class="flex gap-3">
        <button onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">Cancel</button>
        <button id="confirm-delete-btn" onclick="confirmDelete()" class="flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-semibold transition-colors">Delete</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const user   = nlcRequireAuth('login.html');
    const params = new URLSearchParams(window.location.search);
    const quizId = parseInt(params.get('id'));

    if (!quizId) window.location.href = 'dashboard.html';
    if (user) loadQuiz();

    const SUBJECT_COLORS = {
      'Math':'bg-blue-100 dark:bg-blue-900/30 text-blue-600','Science':'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600',
      'English':'bg-violet-100 dark:bg-violet-900/30 text-violet-600','History':'bg-amber-100 dark:bg-amber-900/30 text-amber-600',
      'Filipino':'bg-rose-100 dark:bg-rose-900/30 text-rose-600','Technology':'bg-sky-100 dark:bg-sky-900/30 text-sky-600',
      'Programming':'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600',
    };

    async function loadQuiz() {
      try {
        const [quizRes, qRes] = await Promise.all([
          fetch(`../api/quiz/get_one.php?id=${quizId}`),
          fetch(`../api/questions/get_by_quiz.php?id=${quizId}`)
        ]);

        if (!quizRes.ok) { window.location.href = 'dashboard.html'; return; }

        const quiz      = await quizRes.json();
        const questions = qRes.ok ? await qRes.json() : [];

        document.getElementById('detail-loading').classList.add('hidden');
        document.getElementById('detail-content').classList.remove('hidden');

        // Badges
        const badgesEl = document.getElementById('detail-badges');
        if (quiz.subject) {
          const cls = SUBJECT_COLORS[quiz.subject] || 'bg-gray-100 dark:bg-gray-800 text-gray-500';
          badgesEl.innerHTML = `<span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${cls}">${quiz.subject}</span>`;
        }
        badgesEl.innerHTML += `<span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${quiz.is_public ? 'bg-brand-50 dark:bg-brand-900/30 text-brand-600' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}">${quiz.is_public ? '🌐 Public' : '🔒 Private'}</span>`;

        document.getElementById('detail-title').textContent   = quiz.title;
        document.getElementById('detail-desc').textContent    = quiz.description || '';
        document.getElementById('detail-qcount').textContent  = quiz.question_count;
        document.getElementById('detail-creator').textContent = quiz.creator;
        document.getElementById('detail-date').textContent    = new Date(quiz.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('start-btn').href             = `quiz-play.html?id=${quizId}`;

        if (quiz.is_owner) document.getElementById('delete-btn').classList.remove('hidden');

        // Questions preview
        const preview = document.getElementById('questions-preview');
        if (questions.length) {
          preview.innerHTML = questions.map((q, i) => `
            <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 p-4">
              <p class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                <span class="text-brand-600 font-bold mr-2">${i+1}.</span>${q.question_text}
              </p>
              <div class="grid grid-cols-2 gap-2">
                ${q.choices.map((c, ci) => `
                  <div class="text-xs px-3 py-1.5 rounded-lg bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400">
                    ${String.fromCharCode(65+ci)}. ${c}
                  </div>`).join('')}
              </div>
            </div>`).join('');
        }

        document.querySelectorAll('.fade-up').forEach(el => setTimeout(() => el.classList.add('visible'), 50));

      } catch (e) {
        document.getElementById('detail-loading').innerHTML = '<p class="text-red-400 text-sm">Failed to load quiz.</p>';
      }
    }

    document.getElementById('delete-btn').addEventListener('click', () => {
      document.getElementById('delete-modal').classList.replace('hidden','flex');
    });
    function closeDeleteModal() {
      document.getElementById('delete-modal').classList.replace('flex','hidden');
    }
    async function confirmDelete() {
      const btn = document.getElementById('confirm-delete-btn');
      btn.textContent = 'Deleting...';
      btn.disabled = true;
      try {
        const res = await fetch('../api/quiz/delete.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quiz_id: quizId })
        });
        if (res.ok) window.location.href = 'dashboard.html';
        else { btn.textContent = 'Delete'; btn.disabled = false; }
      } catch { btn.textContent = 'Delete'; btn.disabled = false; }
    }
  </script>
  <script src="../assets/js/chatbot.js"></script>
</body>
</html>
