<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght;500;600;700;800&family=Inter:wght;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
        }
      }
    }
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova LC — Results</title>
  <script>
    const _t = localStorage.getItem('nlc-theme');
    if (_t === 'dark' || (!_t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
  <style>
    @keyframes confetti-fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      animation: confetti-fall linear forwards;
      border-radius: 2px;
      z-index: 999;
      pointer-events: none;
    }
    @keyframes score-pop {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .score-pop { animation: score-pop 0.5s ease 0.2s both; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-gray-950/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800">
    <div class="max-w-2xl mx-auto px-6 h-16 flex items-center justify-between">
      <span class="font-bold text-lg font-jakarta">Nova<span class="text-brand-600">LC</span></span>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <svg class="w-4 h-4 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 pt-24 pb-16">

    <!-- Score hero -->
    <div class="text-center mb-10 fade-up">
      <div id="score-emoji" class="text-5xl mb-4 score-pop"></div>
      <div id="score-display" class="text-6xl md:text-7xl font-extrabold font-jakarta mb-2 score-pop"></div>
      <div id="score-label" class="text-lg font-semibold text-gray-500 dark:text-gray-400 mb-1"></div>
      <div id="score-message" class="text-sm text-gray-400"></div>
    </div>

    <!-- Action buttons -->
    <div class="flex flex-wrap items-center justify-center gap-3 mb-12 fade-up">
      <a id="play-again-btn" href="#" class="btn-primary text-white font-semibold px-6 py-2.5 rounded-xl text-sm flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Play Again
      </a>
      <a id="detail-btn" href="#" class="px-6 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">
        View Quiz
      </a>
      <a href="dashboard.html" class="px-6 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:border-brand-400 hover:text-brand-600 transition-all">
        Dashboard
      </a>
    </div>

    <!-- Results breakdown -->
    <div class="fade-up">
      <h2 class="text-lg font-bold font-jakarta mb-4">Question Breakdown</h2>
      <div id="breakdown" class="space-y-3">
        <div class="text-center py-8 text-gray-400 text-sm">
          <svg class="w-5 h-5 animate-spin mx-auto mb-2 text-brand-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
          Loading breakdown...
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    nlcRequireAuth('login.html');

    const params  = new URLSearchParams(window.location.search);
    const quizId  = parseInt(params.get('id'));
    const score   = parseInt(params.get('score'));
    const total   = parseInt(params.get('total'));
    const answers = JSON.parse(decodeURIComponent(params.get('answers') || '[]'));
    const pct     = Math.round(score / total * 100);

    document.getElementById('play-again-btn').href = `quiz-play.html?id=${quizId}`;
    document.getElementById('detail-btn').href     = `quiz-detail.html?id=${quizId}`;

    // Score display
    let emoji, message, colorClass;
    if (pct >= 90)      { emoji = '🏆'; message = 'Outstanding! You nailed it!';        colorClass = 'text-emerald-500'; }
    else if (pct >= 80) { emoji = '🎉'; message = 'Great job! Keep it up!';              colorClass = 'text-brand-600'; }
    else if (pct >= 60) { emoji = '👍'; message = 'Good effort! Review the misses.';     colorClass = 'text-amber-500'; }
    else if (pct >= 40) { emoji = '📚'; message = 'Keep studying — you\'re getting there!'; colorClass = 'text-orange-500'; }
    else                { emoji = '💪'; message = 'Don\'t give up! Try again.';           colorClass = 'text-red-500'; }

    document.getElementById('score-emoji').textContent   = emoji;
    document.getElementById('score-display').className  += ` ${colorClass}`;
    document.getElementById('score-display').textContent = `${score}/${total}`;
    document.getElementById('score-label').textContent   = `${pct}%`;
    document.getElementById('score-message').textContent = message;

    // Confetti if >= 80%
    if (pct >= 80) launchConfetti();

    // Animate in
    document.querySelectorAll('.fade-up').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 100);
    });

    // Load breakdown
    loadBreakdown();

    async function loadBreakdown() {
      try {
        const res = await fetch(`../api/questions/get_by_quiz.php?id=${quizId}`);
        if (!res.ok) throw new Error();
        const questions = await res.json();

        const breakdown = document.getElementById('breakdown');
        breakdown.innerHTML = questions.map((q, i) => {
          const chosen  = answers[i] ?? -1;
          const correct = chosen === q.correct_index;
          return `
            <div class="bg-white dark:bg-gray-900 rounded-2xl border ${correct ? 'border-emerald-100 dark:border-emerald-800' : 'border-red-100 dark:border-red-900'} p-5">
              <div class="flex items-start gap-3 mb-3">
                <span class="text-lg flex-shrink-0">${correct ? '✅' : '❌'}</span>
                <p class="text-sm font-semibold text-gray-800 dark:text-gray-200 leading-snug">${i+1}. ${q.question_text}</p>
              </div>
              <div class="grid grid-cols-2 gap-2 ml-8">
                ${q.choices.map((c, ci) => {
                  let cls = 'bg-gray-50 dark:bg-gray-800 text-gray-400';
                  if (ci === q.correct_index) cls = 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 font-semibold border border-emerald-100 dark:border-emerald-800';
                  else if (ci === chosen)     cls = 'bg-red-50 dark:bg-red-900/20 text-red-500 border border-red-100 dark:border-red-800';
                  return `<div class="text-xs px-3 py-1.5 rounded-lg ${cls}">${String.fromCharCode(65+ci)}. ${c}${ci === q.correct_index ? ' ✓' : (ci === chosen ? ' ✗' : '')}</div>`;
                }).join('')}
              </div>
            </div>`;
        }).join('');
      } catch {
        document.getElementById('breakdown').innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Could not load breakdown.</p>';
      }
    }

    function launchConfetti() {
      const colors = ['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899'];
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'confetti-piece';
          el.style.left            = Math.random() * 100 + 'vw';
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
          el.style.animationDelay  = '0s';
          el.style.borderRadius    = Math.random() > 0.5 ? '50%' : '2px';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 4000);
        }, Math.random() * 800);
      }
    }
  </script>
  <script src="../assets/js/chatbot.js"></script>
</body>
</html>
